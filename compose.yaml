# Local stack that mirrors the AWS deployment (DEPLOYMENT-ROADMAP.md, Phase 3).
# Assumes the sibling layout from the workspace README.md: ../auth-server,
# ../membership-management and ../staff-app next to this repo.

name: ekklesiaio

# Set once: membership-management and staff-app must agree on the church's calendar date.
x-church-timezone: &church-timezone America/Managua

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD:?set it in .env}
      AUTH_APP_PASSWORD: ${AUTH_APP_PASSWORD:?set it in .env}
      MEMBERS_OWNER_PASSWORD: ${MEMBERS_OWNER_PASSWORD:?set it in .env}
      MEMBERS_APP_PASSWORD: ${MEMBERS_APP_PASSWORD:?set it in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1, not the socket: during init the entrypoint runs a temporary server that
      # listens only on the socket, so a socket check reports "ready" before the init script ends.
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10
  # No ports: like RDS in private subnets. Use `docker compose exec postgres psql -U postgres`.
  # One-shot: applies auth-server's drizzle migrations, then exits. Same image as the app (step 3),
  # different command, like the one-off ECS task that runs before each deploy. Connects as the
  # owner role, the only one allowed to run DDL.
  auth-migrate:
    build: ../auth-server
    image: ekklesiaio/auth-server:local
    command: [ "node", "dist/migrate.js" ]
    environment:
      DATABASE_URL: postgresql://auth_owner:${AUTH_OWNER_PASSWORD:?set it in .env}@postgres:5432/auth
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot, as above, for membership-management's Alembic migrations. It needs only these two
  # variables (no SQL Server URL, no token). ENVIRONMENT=production is the ECS task's value, and it
  # stops the app from looking for a .env file.
  members-migrate:
    build: ../membership-management
    image: ekklesiaio/membership-management:local
    command: [ "python", "-m", "membership_management.data.migrate" ]
    environment:
      ENVIRONMENT: production
      MEMBERS_DATABASE_URL: postgresql+psycopg://members_owner:${MEMBERS_OWNER_PASSWORD:?set it in .env}@postgres:5432/members
    depends_on:
      postgres:
        condition: service_healthy

  # Dev-only demo data (Managua members, small groups with leaders). Never runs on a plain `up`:
  #   docker compose --profile seed run --rm members-seed          (refuses if any table has rows)
  #   docker compose --profile seed run --rm members-seed --reset  (truncates first)
  # entrypoint, not command, so arguments to `run` append to it. No build: a profile service is only
  # started with `run`, after the stack built the image. The seed refuses ENVIRONMENT=production,
  # hence staging. Owner role: --reset TRUNCATEs with RESTART IDENTITY, which needs TRUNCATE and
  # sequence ownership. Never run against RDS.
  members-seed:
    image: ekklesiaio/membership-management:local
    profiles: [ seed ]
    entrypoint: [ "python", "-m", "membership_management.data.seed" ]
    environment:
      ENVIRONMENT: staging
      MEMBERS_DATABASE_URL: postgresql+psycopg://members_owner:${MEMBERS_OWNER_PASSWORD:?set it in .env}@postgres:5432/members
    depends_on:
      members-migrate:
        condition: service_completed_successfully

  # Same image as auth-migrate. Both keep build:, since a service with only image: would try to
  # pull ekklesiaio/auth-server:local, which no registry has; the second build is a cache hit.
  # NODE_ENV=production comes from the image, as on ECS: rate limiting on, and MEMBERSHIP_API_URL
  # + INTERNAL_API_TOKEN required at startup.
  auth-server:
    build: ../auth-server
    image: ekklesiaio/auth-server:local
    environment:
      # Public URL = staff-app's origin, as in prod: cookies, email links and the JWT iss/aud go
      # through staff-app's /api/auth/* proxy, so TRUSTED_ORIGINS stays empty.
      BETTER_AUTH_URL: http://localhost:3001
      STAFF_APP_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set it in .env}
      DATABASE_URL: postgresql://auth_app:${AUTH_APP_PASSWORD:?set it in .env}@postgres:5432/auth
      MEMBERSHIP_API_URL: http://membership-management:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set it in .env}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?set it in .env}
      # Nothing trusted in front locally (the browser hits staff-app's published port directly),
      # so auth-server overwrites X-Forwarded-For with the TCP peer. In ECS: the VPC CIDR.
      TRUSTED_PROXIES: ""
    # Above SHUTDOWN_TIMEOUT_MS (20s), or Compose SIGKILLs mid-drain (its default is 10s).
    stop_grace_period: 30s
    healthcheck:
      # Liveness only (decision table): no DB, so a DB blip doesn't flip it.
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5000/health/live" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    # No ports: internal-only, as in prod.

  # Same image as members-migrate. ENVIRONMENT=production as on ECS: the prod code path (no /docs,
  # DEBUG refused, INTERNAL_API_TOKEN required) and no .env lookup. No depends_on on auth-server:
  # the JWKS is fetched lazily on the first request with a token, and ECS has no start order
  # between services either.
  membership-management:
    build: ../membership-management
    image: ekklesiaio/membership-management:local
    environment:
      ENVIRONMENT: production
      # Internal address for the JWKS; iss/aud are the public URL (auth-server's BETTER_AUTH_URL).
      AUTH_SERVER_URL: http://auth-server:5000
      JWT_ISSUER: http://localhost:3001
      JWT_AUDIENCE: http://localhost:3001
      MEMBERS_DATABASE_URL: postgresql+psycopg://members_app:${MEMBERS_APP_PASSWORD:?set it in .env}@postgres:5432/members
      # The Azure SQL dev copy; its firewall must allow your public IP.
      ASSIMILATION_DATABASE_URL: ${ASSIMILATION_DATABASE_URL:?set it in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env}
      CHURCH_TIMEZONE: *church-timezone
    # Above GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS (30s default, equal to REQUEST_TIMEOUT_SECONDS so the
    # longest allowed request can finish), or Compose SIGKILLs mid-drain (its default is 10s).
    stop_grace_period: 40s
    healthcheck:
      # Liveness only. No curl/wget in the image, so Python's urllib (raises on non-2xx).
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
      members-migrate:
        condition: service_completed_successfully
    # No ports: internal-only, as in prod.

  # The only service with a published port: the browser reaches everything through it, as through
  # the ALB in prod. Its /api/auth/* proxy forwards to auth-server (read at runtime, not baked in).
  staff-app:
    build: ../staff-app
    image: ekklesiaio/staff-app:local
    environment:
      AUTH_SERVER_URL: http://auth-server:5000
      APPLICATIONS_MEMBERSHIP_API_URL: http://membership-management:8000
      CHURCH_TIMEZONE: *church-timezone
    ports:
      # Host 3001 = the origin in BETTER_AUTH_URL and the JWT iss/aud. Loopback only, so the stack
      # isn't reachable from other machines on your network.
      - "127.0.0.1:3001:3000"
    healthcheck:
      # Readiness, as for the ALB target group: shallow (config valid, process answers).
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Not a boot requirement (/api/health is shallow, so it starts without them). It's so that
    # `docker compose up staff-app` brings up the whole stack and opens the port once it all works.
    depends_on:
      auth-server:
        condition: service_healthy
      membership-management:
        condition: service_healthy

volumes:
  pgdata:
