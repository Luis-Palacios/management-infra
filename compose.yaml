# Local stack that mirrors the AWS deployment (DEPLOYMENT-ROADMAP.md, Phase 3).
# Assumes the sibling layout from the workspace README.md: ../auth-server,
# ../membership-management and ../staff-app next to this repo.

name: ekklesiaio

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD:?set it in .env}
      AUTH_APP_PASSWORD: ${AUTH_APP_PASSWORD:?set it in .env}
      MEMBERS_OWNER_PASSWORD: ${MEMBERS_OWNER_PASSWORD:?set it in .env}
      MEMBERS_APP_PASSWORD: ${MEMBERS_APP_PASSWORD:?set it in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1, not the socket: during init the entrypoint runs a temporary server that
      # listens only on the socket, so a socket check reports "ready" before the init script ends.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: like RDS in private subnets. Use `docker compose exec postgres psql -U postgres`.

volumes:
  pgdata:
